<form [formGroup]="form">
  <div class="personagem" formGroupName="personagem">
    <div class="informacaoPersonagem" formGroupName="informacaoPersonagem">
      <div class="informacaoPersonagemTitleContainer">
        <h2>Informações do Personagem</h2>
      </div>
      <div class="informacaoBasicaContainer">
        <label>
          Nome
          <input formControlName="nome" type="text" />
        </label>

        <label>
          Rank Agente
          <input formControlName="rankAgente" type="text" />
        </label>

        <label>
          Idade
          <input class="inputNumber" formControlName="idade" type="number" />
        </label>

        <label>
          Sexo
          <input formControlName="sexo" type="text" />
        </label>
      </div>
      
      <div class="treinamento">
        <h3>Treinamento</h3>
        <label>
          Combatente:
          <input formControlName="treinamentoCombatente" type="number">
        </label>
        <label>
          Especialista:
          <input formControlName="treinamentoEspecialista" type="number">
        </label>
        <label>
          Ocultista:
          <input formControlName="treinamentoOcultista" type="number">
        </label>
      </div>
    </div>

    <div class="atributos" formGroupName="atributos">
      <div class="atributosTitleContainer">
        <h2>Atributos</h2>
      </div>
      <div class="atributosValoresContainer">
        <label>
          <a (click)="pegarValorAtributo('forca'); abrirModal(ModalType.DiceRoll)" >
            Força
          </a>
          
          <input formControlName="forca" type="number" />
        </label>

        <label>
          <a (click)="pegarValorAtributo('destreza'); abrirModal(ModalType.DiceRoll)">
            Destreza
          </a>
          
          <input formControlName="destreza" type="number" />
        </label>

        <label>
          <a (click)="pegarValorAtributo('constituicao'); abrirModal(ModalType.DiceRoll)">
            Constituição
          </a>
          
          <input formControlName="constituicao" type="number" />
        </label>

        <label>
          <a (click)="pegarValorAtributo('tamanho'); abrirModal(ModalType.DiceRoll)">
            Tamanho
          </a>
          
          <input formControlName="tamanho" type="number" />
        </label>

        <label>
          <a (click)="pegarValorAtributo('inteligencia'); abrirModal(ModalType.DiceRoll)">
            Inteligência
          </a>
          
          <input formControlName="inteligencia" type="number" />
        </label>

        <label>
          <a (click)="pegarValorAtributo('sabedoria'); abrirModal(ModalType.DiceRoll)">
            Sabedoria
          </a>
          
          <input formControlName="sabedoria" type="number" />
        </label>

        <label>
          <a (click)="pegarValorAtributo('carisma'); abrirModal(ModalType.DiceRoll)">
            Carisma
          </a>
          
          <input formControlName="carisma" type="number" />
        </label>

        <label>
          <a (click)="pegarValorAtributo('poder'); abrirModal(ModalType.DiceRoll)">
            Poder
          </a>
          <input formControlName="poder" type="number" />
        </label>
      </div>
      
    </div>

    <div class="status" formGroupName="status">
      <div class="statusTitleContainer">
        <h2>Status</h2>
      </div>
      
      <div class="statusValoresContainer">
        <div class="statusUnicoValorContainer">
          <label>
            Vida Atual
            <input formControlName="vidaAtual" type="number" />
          </label>
          <label>
            Vida Max
            <input formControlName="vidaMax" type="number" />
          </label>
        </div>

        <div class="statusUnicoValorContainer">
          <label>
            Energia Atual
            <input formControlName="energiaAtual" type="number" />
          </label>
          <label>
            Energia Max
            <input formControlName="energiaMax" type="number" />
          </label>
        </div>

        <div class="statusUnicoValorContainer">
          <label>
            Sanidade Atual
            <input formControlName="sanidadeAtual" type="number" />
          </label>
          <label>
            Sanidade Max
            <input formControlName="sanidadeMax" type="number" />
          </label>
        </div>
      </div>
    </div>

    <div class="pericias">
      <div class="periciasTitle">
        <h3>Perícias</h3>
        <button type="button" (click)="adicionarPericia()" >Adicionar Perícia</button>
      </div>
      <div class="periciasContainer" formArrayName="pericias">
        <div class="periciaUnicaContainer" *ngFor="let p of pericias.controls; let i = index" [formGroupName]="i">
          <div class="nomePericia">
            <input placeholder="Nome da pericia" formControlName="periciaNome" type="text">
          </div>
          <label>
            <input class="inputNumber" formControlName="periciaValor" type="number">
          </label>
          <app-delete-button (clicked)="removerItem(pericias, i)"></app-delete-button>
          <app-roll-button (clicked)="pegarValorPericia(i); abrirModal(ModalType.DiceRoll)"></app-roll-button>
        </div>
      </div>
    </div>

    <div class="bonus" formGroupName="bonus">
      <div class="bonusTitleContainer">
        <h2>Bônus</h2>
        <div>
          Bônus Corpo a Corpo
          <input formControlName="bonusCorpoACorpo" type="number" />
        </div>
      </div>
      <div class="bonusContainer">
        <div class="bonusContainerResistencia">
          <div class="sectionTitle">
            <h3>Resistências</h3>
            <button type="button" (click)="adicionarResistencia()">Adicionar Resistência</button>
          </div>
          <div formArrayName="resistencias">
            <div class="bonusContainerUnico" *ngFor="let p of resistencias.controls; let i = index" [formGroupName]="i">
              <input placeholder="Resistencia" formControlName="resistenciaNome" type="text">
              <input formControlName="resistenciaValor" class="inputNumberBonus" type="number" />
              <app-delete-button (clicked)="removerItem(resistencias, i)"></app-delete-button>
            </div>
          </div>
        </div>

        <div class="outrosBonus" formArrayName="OutrosBonus">
          <div class="sectionTitle">
            <h3>Outros Bônus</h3>
            <button type="button" (click)="adicionarOutrosBonus()">Adicionar Bônus</button>
          </div>
          <div class="bonusContainerUnico" *ngFor="let p of outrosBonus.controls; let i = index" [formGroupName]="i">
            <input placeholder="outro bonus" type="text" formControlName="outroBonusNome">
            <input class="inputNumberBonus" type="number" formControlName="outroBonusValor" />
            <app-delete-button (clicked)="removerItem(outrosBonus, i)"></app-delete-button>
          </div>
        </div>
      </div>
    </div>

    <div class="ataques" formArrayName="ataques">
      <div class="ataquesContainerTitle">
        <h2>Ataques</h2>
        <button type="button" (click)="adicionarAtaques()">Adicionar Ataque</button>
      </div>

      <div class="ataque" *ngFor="let p of ataques.controls; let i = index" [formGroupName]="i">
        <label>
          Nome
          <input formControlName="ataqueNome" type="text" />
        </label>
        <label>
          Perícia
          <input formControlName="ataquePericiaUsada" type="text" />
        </label>
        <label>
          Dano
          <input formControlName="ataqueDano" type="text" />
        </label>
        <label>
          Tipo
          <input formControlName="tipoDano" type="text" />
        </label>
        <label>
          Efeito
          <input formControlName="ataqueEfeito" type="text" />
        </label>
        <label>
          Munição
          <input formControlName="ataqueMunicao" type="text" />
        </label>
        <app-delete-button (clicked)="removerItem(ataques, i)"></app-delete-button>
        <app-roll-button (clicked)="pegarValorPericiaAtaque(i) ; pegarDanoAtaque(i); abrirModal(ModalType.ataqueRoll)"></app-roll-button>
      </div>
    </div>
  </div>
</form>
<app-modal *ngIf="modalAberto" (clicked)="fecharModal()">
  <app-modal-dice-roll (clicked)="fecharModal()" *ngIf="modalAtivo === 'DiceRoll'" [valorPericiaUsada]="valorPericiaUsada"></app-modal-dice-roll>
  <app-ataque-roll-modal (clicked)="fecharModal()" *ngIf="modalAtivo === 'ataqueRoll'" [valorPericiaUsada]="valorPericiaUsada" [danoAtaqueInput]="danoAtaque" ></app-ataque-roll-modal>
</app-modal>
